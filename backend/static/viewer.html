<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<style>
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#EDEEF2}
  #c{width:100%;height:100%;display:block;touch-action:none}

    background:rgba(20,22,28,.88);
    -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);

</style>
<script type="importmap">
{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}
</script>
</head>
<body>
<canvas id="c"></canvas>
<div id="hoverbar"><span class="dot"></span><span class="lbl">Código</span><span id="hovercode"></span></div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const BASE_COLOR = 0xC9CFDA;

function hexToInt(hex) {
  if (!hex) return null;
  const h = hex.replace('#', '');
  const n = parseInt(h, 16);
  return Number.isNaN(n) ? null : n;
}

function send(msg) {
  const s = JSON.stringify(msg);
  if (window.ReactNativeWebView && window.ReactNativeWebView.postMessage) {
    window.ReactNativeWebView.postMessage(s);
  } else if (window.parent && window.parent !== window) {
    window.parent.postMessage(s, '*');
  }
}

const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.5));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setClearColor(0xEDEEF2);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.shadowMap.autoUpdate = false; // static scene: recompute only when visibility changes

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 10000);
scene.add(camera);

scene.add(new THREE.HemisphereLight(0xffffff, 0x3d4652, 0.65));
const dirLight = new THREE.DirectionalLight(0xffffff, 1.05);
dirLight.position.set(0.3, 0.5, 1);
camera.add(dirLight);
const fillLight = new THREE.DirectionalLight(0xffffff, 0.3);
fillLight.position.set(-1, -0.4, -0.6);
scene.add(fillLight);

const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true;
controls.dampingFactor = 0.35;

let renderQueued = false;
function requestRender() {
  if (renderQueued) return;
  renderQueued = true;
  requestAnimationFrame(() => { renderQueued = false; controls.update(); renderer.render(scene, camera); });
}
controls.addEventListener('change', requestRender);

// damping needs a few frames after an actual drag (not after taps)
let dampingFrames = 0;
function dampLoop() {
  if (dampingFrames > 0) { dampingFrames--; requestRender(); requestAnimationFrame(dampLoop); }
}

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  requestRender();
});

// Materials (shared per molde color/highlight combo)
const matCache = {};
function matFor(tagData, highlighted, hovered) {
  const hex = tagData && tagData.color ? hexToInt(tagData.color) : null;
  const key = (hex !== null ? hex : 'none') + (highlighted ? '_hl' : (hovered ? '_hv' : ''));
  if (!matCache[key]) {
    const color = hex !== null ? hex : BASE_COLOR;
    const m = new THREE.MeshLambertMaterial({ color, side: THREE.DoubleSide });
    if (highlighted) {
      m.emissive = new THREE.Color(hex !== null ? color : 0x2E6BD6).multiplyScalar(0.45);
    } else if (hovered) {
      m.emissive = new THREE.Color(hex !== null ? color : 0x2E6BD6).multiplyScalar(0.2);
    }
    matCache[key] = m;
  }
  return matCache[key];
}

// Black edge outlines (shared material + cached per-geometry edges)
const edgeMat = new THREE.LineBasicMaterial({ color: 0x111111 });
const edgeCache = new Map();
function edgesFor(geom) {
  if (!edgeCache.has(geom.uuid)) edgeCache.set(geom.uuid, new THREE.EdgesGeometry(geom, 25));
  return edgeCache.get(geom.uuid);
}

const meshesByName = {};
const meshList = [];
let tags = {};
// Fabrication phase layer: {name: {color, label}} drawn over the mold color without touching the mold tag.
let phases = {};
let phaseVisible = true;
let tagsVisible = true;
let weekHighlighted = new Set();
function shownTag(name) {
  if (weekHighlighted.has(name)) return { color: '#FFFFFF' };
  const ph = phaseVisible && phases[name];
  return ph ? { color: ph.color } : (tagsVisible && tags[name]) || null;
}
let selectedName = null;
let multiMode = false;
const multiSelected = new Set();
let hoveredName = null;
let pendingTags = null;
let pendingFocus = null;
let isolation = 'all';
let sceneMaxDim = 1;
let modelCenter = new THREE.Vector3();
let modelTopY = 0;
let loaded = false;
const exportDecorations = [];

function isVisibleFor(name) {
  const molde = (tags[name] && tags[name].molde) || null;
  return isolation === 'all' || (isolation === 'none' ? !molde : molde === isolation);
}

function isHighlighted(name) {
  return name === selectedName || multiSelected.has(name) || weekHighlighted.has(name);
}

function refreshMesh(name) {
  const m = meshesByName[name];
  if (!m) return;
  m.material = matFor(shownTag(name), isHighlighted(name), name === hoveredName);
  m.visible = isVisibleFor(name);
  renderer.shadowMap.needsUpdate = true;
  requestRender();
}

function applyAll() {
  for (const mesh of meshList) {
    const key = mesh.userData.orig || mesh.name;
    mesh.material = matFor(shownTag(key), isHighlighted(key), key === hoveredName);
    mesh.visible = isVisibleFor(key);
  }
  updateFrontLabelVisibility();
  renderer.shadowMap.needsUpdate = true;
  requestRender();
}

function animateCamera(toPos, toTarget) {
  const fromPos = camera.position.clone();
  const fromTarget = controls.target.clone();
  const start = performance.now();
  const dur = 700;
  function step() {
    const k = Math.min((performance.now() - start) / dur, 1);
    const e = 1 - Math.pow(1 - k, 3);
    camera.position.lerpVectors(fromPos, toPos, e);
    controls.target.lerpVectors(fromTarget, toTarget, e);
    controls.update();
    renderer.render(scene, camera);
    if (k < 1) requestAnimationFrame(step);
  }
  step();
}

function focusByName(name) {
  const m = meshesByName[name];
  if (!m) return;
  if (!m.visible) { isolation = 'all'; applyAll(); }
  const prev = selectedName;
  selectedName = name;
  if (prev) refreshMesh(prev);
  refreshMesh(name);
  const box = new THREE.Box3().setFromObject(m);
  const center = box.getCenter(new THREE.Vector3());
  const size = box.getSize(new THREE.Vector3());
  const radius = Math.max(size.length() / 2, sceneMaxDim * 0.01);
  const dist = Math.max((radius / Math.tan((camera.fov * Math.PI) / 360)) * 1.6, sceneMaxDim * 0.03);
  const dir = camera.position.clone().sub(controls.target).normalize();
  animateCamera(center.clone().add(dir.multiplyScalar(dist)), center);
}

window.viewerAPI = {
  applyTags(json) {
    const o = typeof json === 'string' ? JSON.parse(json) : (json || {});
    tags = o;
    if (!loaded) { pendingTags = o; return; }
    applyAll();
  },
  setTag(name, tagData) {
    if (tagData) tags[name] = tagData; else delete tags[name];
    refreshMesh(name);
  },
  applyPhases(map) {
    phases = map || {};
    if (loaded) applyAll();
  },
  highlightWeek(names) {
    weekHighlighted = new Set((names || []).filter((name) => meshesByName[name]));
    if (weekHighlighted.size) isolation = 'all';
    if (loaded) applyAll();
    send({ type: 'weekHighlight', count: weekHighlighted.size,
      visible: meshList.filter((mesh) => mesh.visible).length, total: meshList.length });
  },
  setPhaseVisible(on) {
    phaseVisible = !!on;
    if (loaded) { applyAll(); rebuildFrontLabels(); }
  },
  setFrontLabels(groups) {
    frontLabelGroups = groups || [];
    if (loaded) rebuildFrontLabels();
  },
  setTagsVisible(on) {
    tagsVisible = !!on;
    if (loaded) applyAll();
  },
  clearSelection() {
    const prev = selectedName;
    selectedName = null;
    if (prev) refreshMesh(prev);
  },
  isolate(mode) {
    isolation = mode || 'all';
    if (!loaded) return;
    applyAll();
  },
  focusObject(name) {
    if (!loaded) { pendingFocus = name; return; }
    focusByName(name);
  },
  setMultiMode(on) {
    multiMode = !!on;
    if (!multiMode) multiSelected.clear();
    selectedName = null;
    if (loaded) applyAll();
    send({ type: 'multiselect', names: [] });
  },
  clearMultiSelection() {
    multiSelected.clear();
    if (loaded) applyAll();
    send({ type: 'multiselect', names: [] });
  },
  selectNames(names, additive) {
    multiMode = true;
    if (!additive) multiSelected.clear();
    (names || []).forEach((n) => { if (meshesByName[n]) multiSelected.add(n); });
    selectedName = null;
    if (loaded) applyAll();
    send({ type: 'multiselect', names: Array.from(multiSelected) });
  },
  captureFacades(id) {
    if (!loaded) { send({ type: 'facadeCaptures', id, error: 'El modelo 3D aún no ha cargado.' }); return; }
    const oldPosition = camera.position.clone();
    const oldTarget = controls.target.clone();
    const oldAspect = camera.aspect;
    const visibility = meshList.map((mesh) => mesh.visible);
    const decorationVisibility = exportDecorations.map((mesh) => mesh.visible);
    const labelVisibility = frontLabelEntries.map((entry) => entry.sprite.visible);
    const clearColor = renderer.getClearColor(new THREE.Color()).clone();
    const clearAlpha = renderer.getClearAlpha();
    try {
      const width = 640, height = 480;
      renderer.setSize(width, height, false);
      renderer.setClearColor(0x000000, 0);
      camera.aspect = width / height;
      camera.updateProjectionMatrix();
      meshList.forEach((mesh) => { mesh.visible = true; });
      exportDecorations.forEach((mesh) => { mesh.visible = false; });
      frontLabelEntries.forEach((entry) => { entry.sprite.visible = false; });
      const directions = {
        norte: [-0.6, 0.7, -1], sur: [0.6, 0.7, 1],
        este: [1, 0.7, -0.6], oeste: [-1, 0.7, 0.6],
      };
      const images = {};
      for (const [name, xyz] of Object.entries(directions)) {
        camera.position.copy(modelCenter).add(new THREE.Vector3(...xyz).normalize().multiplyScalar(sceneMaxDim * 1.85));
        controls.target.copy(modelCenter);
        camera.lookAt(modelCenter);
        renderer.shadowMap.needsUpdate = true;
        renderer.render(scene, camera);
        images[name] = canvas.toDataURL('image/png');
      }
      send({ type: 'facadeCaptures', id, images });
    } catch (error) {
      send({ type: 'facadeCaptures', id, error: 'No se pudieron capturar las fachadas del modelo.' });
    } finally {
      meshList.forEach((mesh, index) => { mesh.visible = visibility[index]; });
      exportDecorations.forEach((mesh, index) => { mesh.visible = decorationVisibility[index]; });
      frontLabelEntries.forEach((entry, index) => { entry.sprite.visible = labelVisibility[index]; });
      renderer.setClearColor(clearColor, clearAlpha);
      camera.position.copy(oldPosition);
      controls.target.copy(oldTarget);
      camera.aspect = oldAspect;
      camera.updateProjectionMatrix();
      controls.update();
      renderer.setSize(window.innerWidth, window.innerHeight, false);
      renderer.shadowMap.needsUpdate = true;
      requestRender();
    }
  },
};

// Command channel: works cross-origin (parent postMessage) and from RN WebView (injectJavaScript)
function handleCmd(data) {
  try {
    const msg = typeof data === 'string' ? JSON.parse(data) : data;
    if (!msg || !msg.__viewerCmd || !msg.cmd) return;
    const fn = window.viewerAPI[msg.cmd];
    if (typeof fn === 'function') fn.apply(window.viewerAPI, msg.args || []);
  } catch (e) {}
}
window.__handleViewerCmd = handleCmd;
window.addEventListener('message', (e) => handleCmd(e.data));

// Ground compass labels (Norte, Sur, Este, Oeste)
function makeGroundLabel(letter, word) {
  const cv = document.createElement('canvas');
  cv.width = 512; cv.height = 512;
  const ctx = cv.getContext('2d');
  ctx.clearRect(0, 0, 512, 512);
  ctx.fillStyle = '#1C1C1E';
  ctx.textAlign = 'center';
  ctx.font = '900 250px system-ui, -apple-system, sans-serif';
  ctx.fillText(letter, 256, 275);
  ctx.font = '700 78px system-ui, -apple-system, sans-serif';
  ctx.fillText(word, 256, 395);
  const tex = new THREE.CanvasTexture(cv);
  tex.anisotropy = 4;
  const mat = new THREE.MeshBasicMaterial({ map: tex, transparent: true, side: THREE.DoubleSide, depthWrite: false });
  const mesh = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), mat);
  mesh.renderOrder = 1;
  mesh.raycast = () => {};
  return mesh;
}

function addCompassLabels(box, size, center, maxDim) {
  const groundY = box.min.y + maxDim * 0.005;
  const half = Math.max(size.x, size.z) / 2;
  const labelSize = maxDim * 0.14;
  const offset = half + labelSize * 0.9;
  const defs = [
    ['N', 'NORTE', 0, -offset],
    ['S', 'SUR', 0, offset],
    ['E', 'ESTE', offset, 0],
    ['O', 'OESTE', -offset, 0],
  ];
  for (const [letter, word, dx, dz] of defs) {
    const m = makeGroundLabel(letter, word);
    m.scale.set(labelSize, labelSize, 1);
    m.rotation.x = -Math.PI / 2;
    m.position.set(center.x + dx, groundY, center.z + dz);
    scene.add(m);
    exportDecorations.push(m);
  }
}

// Front labels: one billboard per front, anchored above its own panels.
const frontLabelEntries = [];
let frontLabelGroups = [];
// Fronts whose own top is hidden behind other geometry: lift their label to the top of the model.
const frontLabelsLifted = new Set(['Frente 3']);

function makeFrontLabel(text) {
  const W = 512, H = 160;
  const cv = document.createElement('canvas');
  cv.width = W; cv.height = H;
  const ctx = cv.getContext('2d');
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = '#FFFFFF';
  ctx.shadowColor = 'rgba(0,0,0,0.55)';
  ctx.shadowBlur = 18;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  const font = (size) => `900 ${size}px system-ui, -apple-system, sans-serif`;
  let size = 120;
  ctx.font = font(size);
  while (ctx.measureText(text).width > W - 40 && size > 30) { size -= 4; ctx.font = font(size); }
  ctx.fillText(text, W / 2, H / 2);
  const tex = new THREE.CanvasTexture(cv);
  tex.anisotropy = 4;
  const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, depthWrite: false }));
  sprite.renderOrder = 2;
  sprite.raycast = () => {};
  return sprite;
}

function clearFrontLabels() {
  for (const entry of frontLabelEntries) {
    scene.remove(entry.sprite);
    entry.sprite.material.map.dispose();
    entry.sprite.material.dispose();
  }
  frontLabelEntries.length = 0;
}

function updateFrontLabelVisibility() {
  for (const entry of frontLabelEntries) {
    entry.sprite.visible = phaseVisible && entry.meshes.some((mesh) => mesh.visible);
  }
}

function rebuildFrontLabels() {
  clearFrontLabels();
  if (!loaded || !phaseVisible) return;
  const height = sceneMaxDim * 0.032;
  for (const group of frontLabelGroups) {
    const meshes = (group.names || []).map((n) => meshesByName[n]).filter(Boolean);
    if (!meshes.length) continue;
    const box = new THREE.Box3();
    for (const mesh of meshes) box.expandByObject(mesh);
    const center = box.getCenter(new THREE.Vector3());
    const sprite = makeFrontLabel(group.text);
    sprite.scale.set(height * 3.2, height, 1);
    const topY = frontLabelsLifted.has(group.text)
      ? box.max.y + (modelTopY - box.max.y) * 0.5
      : box.max.y;
    sprite.position.set(center.x, topY + height * 0.7, center.z);
    scene.add(sprite);
    frontLabelEntries.push({ sprite, meshes });
  }
  updateFrontLabelVisibility();
  requestRender();
}

// Load model
// GLTFLoader sanitizes node names (spaces -> _ and removes [ ] . : / ),
// so map sanitized names back to the original GLB node names.
function sanitizeName(name) {
  return name.replace(/\s/g, '_').replace(/[\[\]\.:\/]/g, '');
}

const loader = new GLTFLoader();
loader.load('/api/model',
  (gltf) => {
    const root = gltf.scene;
    const origBySan = {};
    const jsonNodes = (gltf.parser && gltf.parser.json && gltf.parser.json.nodes) || [];
    for (const nd of jsonNodes) {
      if (nd && nd.name && nd.mesh !== undefined) origBySan[sanitizeName(nd.name)] = nd.name;
    }
    let i = 0;
    root.traverse((child) => {
      if (child.isMesh) {
        if (!child.geometry.attributes.normal) child.geometry.computeVertexNormals();
        if (!child.name) child.name = 'objeto_' + (i++);
        const orig = origBySan[child.name] || child.name;
        child.userData.orig = orig;
        child.material = matFor(null, false);
        child.castShadow = true;
        child.receiveShadow = true;
        const outline = new THREE.LineSegments(edgesFor(child.geometry), edgeMat);
        outline.raycast = () => {};
        child.add(outline);
        meshesByName[orig] = child;
        meshList.push(child);
      }
    });
    scene.add(root);
    const box = new THREE.Box3().setFromObject(root);
    const size = box.getSize(new THREE.Vector3());
    const center = box.getCenter(new THREE.Vector3());
    const maxDim = Math.max(size.x, size.y, size.z);
    sceneMaxDim = maxDim;
    modelCenter.copy(center);
    modelTopY = box.max.y;
    camera.near = Math.max(maxDim / 1000, 0.01);
    camera.far = maxDim * 20;
    camera.updateProjectionMatrix();
    camera.position.set(center.x + maxDim * 0.7, center.y + maxDim * 0.5, center.z + maxDim * 0.7);
    controls.target.copy(center);
    controls.maxDistance = maxDim * 5;
    controls.update();
    addCompassLabels(box, size, center, maxDim);

    // Fixed sun light with shadows fitted to the model bounds
    const sun = new THREE.DirectionalLight(0xffffff, 1.15);
    sun.position.set(center.x + maxDim * 0.6, box.max.y + maxDim * 0.8, center.z + maxDim * 0.4);
    sun.target.position.copy(center);
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    const r = size.length() / 2;
    const sc = sun.shadow.camera;
    sc.left = -r; sc.right = r; sc.top = r; sc.bottom = -r;
    sc.near = 0.1; sc.far = maxDim * 4;
    sun.shadow.bias = -0.0003;
    sun.shadow.normalBias = maxDim * 0.002;
    scene.add(sun);
    scene.add(sun.target);

    // Ground plane that receives the building's shadow
    const ground = new THREE.Mesh(
      new THREE.PlaneGeometry(maxDim * 4, maxDim * 4),
      new THREE.ShadowMaterial({ opacity: 0.22 })
    );
    ground.rotation.x = -Math.PI / 2;
    ground.position.set(center.x, box.min.y - maxDim * 0.001, center.z);
    ground.receiveShadow = true;
    ground.raycast = () => {};
    scene.add(ground);
    exportDecorations.push(ground);
    renderer.shadowMap.needsUpdate = true;
    loaded = true;
    if (pendingTags) { tags = pendingTags; pendingTags = null; }
    applyAll();
    rebuildFrontLabels();
    if (pendingFocus) { const f = pendingFocus; pendingFocus = null; focusByName(f); }
    // Compute per-piece façade orientation (N=-Z, S=+Z, E=+X, O=-X) and persist once
    try {
      scene.updateMatrixWorld(true);
      const facadeMap = {};
      const dimsMap = {};
      const v = new THREE.Vector3();
      const bb = new THREE.Box3();
      const sz = new THREE.Vector3();
      for (const mesh of meshList) {
        if (!mesh.geometry.boundingSphere) mesh.geometry.computeBoundingSphere();
        v.copy(mesh.geometry.boundingSphere.center).applyMatrix4(mesh.matrixWorld);
        const dx = v.x - center.x, dz = v.z - center.z;
        const key = mesh.userData.orig || mesh.name;
        facadeMap[key] =
          Math.abs(dx) > Math.abs(dz) ? (dx > 0 ? 'este' : 'oeste') : (dz > 0 ? 'sur' : 'norte');
        if (!mesh.geometry.boundingBox) mesh.geometry.computeBoundingBox();
        bb.copy(mesh.geometry.boundingBox).applyMatrix4(mesh.matrixWorld);
        bb.getSize(sz);
        dimsMap[key] = [sz.x, sz.y, sz.z];
      }
      fetch('/api/facades/count')
        .then((r) => r.json())
        .then((d) => {
          if (!d.count) {
            fetch('/api/facades', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ facades: facadeMap }),
            });
          }
        })
        .catch(() => {});
      fetch('/api/dims/count')
        .then((r) => r.json())
        .then((d) => {
          if (!d.count) {
            fetch('/api/dims', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ dims: dimsMap }),
            });
          }
        })
        .catch(() => {});
    } catch (e) {}
    send({ type: 'loaded', count: meshList.length });
  },
  (xhr) => {
    if (xhr.total > 0) {
      send({ type: 'progress', pct: Math.round((xhr.loaded / xhr.total) * 100) });
    }
  },
  (err) => {
    send({ type: 'error', message: String(err && err.message ? err.message : err) });
  }
);

// Tap to select (distinguish tap from drag)
const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();
let downX = 0, downY = 0, downT = 0;
let pointerDown = false;

canvas.addEventListener('pointerdown', (e) => { downX = e.clientX; downY = e.clientY; downT = Date.now(); pointerDown = true; });
canvas.addEventListener('pointerup', (e) => {
  pointerDown = false;
  const dist = Math.hypot(e.clientX - downX, e.clientY - downY);
  if (dist > 10) { dampingFrames = 6; dampLoop(); return; }
  if (Date.now() - downT > 600 || !loaded) return;
  pointer.x = (e.clientX / window.innerWidth) * 2 - 1;
  pointer.y = -(e.clientY / window.innerHeight) * 2 + 1;
  raycaster.setFromCamera(pointer, camera);
  const hits = raycaster.intersectObjects(meshList.filter((m) => m.visible), false);
  if (hits.length > 0) {
    const name = hits[0].object.userData.orig || hits[0].object.name;
    if (multiMode) {
      if (multiSelected.has(name)) multiSelected.delete(name);
      else multiSelected.add(name);
      refreshMesh(name);
      send({ type: 'multiselect', names: Array.from(multiSelected) });
      return;
    }
    const prev = selectedName;
    selectedName = name;
    if (prev) refreshMesh(prev);
    refreshMesh(name);
    send({ type: 'select', name });
  }
});

// Hover: fixed info bar with the piece code + soft highlight
const hoverbar = document.getElementById('hoverbar');
const hovercode = document.getElementById('hovercode');

function displayName(name) {
  if (!name) return name;
  const parts = name.split(' ');
  if (parts.length >= 2 && parts[0] === parts[1]) parts.splice(1, 1);
  return parts.join(' ');
}

function setHover(name) {
  if (name === hoveredName) return;
  const prev = hoveredName;
  hoveredName = name;
  if (prev) refreshMesh(prev);
  if (name) refreshMesh(name);
  if (name) {
    const molde = tags[name] && tags[name].molde;
    const phase = phaseVisible && phases[name] && phases[name].label;
    hovercode.textContent = [displayName(name), molde, phase].filter(Boolean).join(' · ');
    hoverbar.classList.add('on');
  } else {
    hoverbar.classList.remove('on');
  }
  canvas.style.cursor = name ? 'pointer' : '';
}

let hoverQueued = false;
let lastMove = null;
function processHover() {
  hoverQueued = false;
  if (!loaded || !lastMove || pointerDown) return;
  pointer.x = (lastMove.x / window.innerWidth) * 2 - 1;
  pointer.y = -(lastMove.y / window.innerHeight) * 2 + 1;
  raycaster.setFromCamera(pointer, camera);
  const hits = raycaster.intersectObjects(meshList.filter((m) => m.visible), false);
  setHover(hits.length > 0 ? (hits[0].object.userData.orig || hits[0].object.name) : null);
}

canvas.addEventListener('pointermove', (e) => {
  if (e.pointerType !== 'mouse') return;
  lastMove = { x: e.clientX, y: e.clientY };
  if (hoverQueued) return;
  hoverQueued = true;
  requestAnimationFrame(processHover);
});
canvas.addEventListener('pointerleave', () => { lastMove = null; setHover(null); });

send({ type: 'ready' });
</script>
</body>
