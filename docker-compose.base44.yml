services:
  mongo:
    image: mongo:7
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    image: python:3.12-slim
    working_dir: /app/backend
    volumes:
      - ./backend:/app/backend
      - pip-cache:/root/.cache/pip
    environment:
      - MONGO_URL=mongodb://mongo:27017
      - DB_NAME=bimtracker
      - PYTHONUNBUFFERED=1
    env_file:
      - /run/base44/app.env
    # emergentintegrations is only on Emergent's private index and is not imported by server.py
    command: >
      sh -c "grep -v '^emergentintegrations' requirements.txt > /tmp/req.txt &&
             pip install -q -r /tmp/req.txt &&
             uvicorn server:app --host 0.0.0.0 --port 8001 --reload"
    ports:
      - "8001:8001"
    depends_on:
      mongo:
        condition: service_healthy

  frontend:
    image: node:20
    working_dir: /app/frontend
    volumes:
      - ./frontend:/app/frontend
      - frontend-node-modules:/app/frontend/node_modules
    environment:
      - REACT_APP_BACKEND_URL=
      - BACKEND_PROXY_TARGET=http://backend:8001
      - HOST=0.0.0.0
      - PORT=3000
      - DANGEROUSLY_DISABLE_HOST_CHECK=true
      - WDS_SOCKET_PORT=443
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
      - BROWSER=none
    command: sh -c "yarn install --network-timeout 600000 && yarn start"
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  mongo-data:
  pip-cache:
  frontend-node-modules:
