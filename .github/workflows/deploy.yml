# Auto-deploy to the VPS on every push/merge to main.
# Required repo secrets: VPS_HOST, VPS_USER, VPS_SSH_KEY. Optional: VPS_PORT (default 22), VPS_APP_DIR (default ~/nabimoldes).
name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          command_timeout: 25m
          script: |
            set -e
            APP_DIR="${{ secrets.VPS_APP_DIR }}"
            cd "${APP_DIR:-$HOME/nabimoldes}"
            git fetch --prune origin main
            git reset --hard origin/main
            docker compose -f deploy/docker-compose.prod.yml up -d --build --remove-orphans
            docker image prune -f
            for i in $(seq 1 40); do
              if docker compose -f deploy/docker-compose.prod.yml ps backend | grep -q healthy; then
                echo "Deploy OK"; exit 0
              fi
              sleep 10
            done
            docker compose -f deploy/docker-compose.prod.yml ps
            docker compose -f deploy/docker-compose.prod.yml logs --tail 50 backend
            echo "Backend did not become healthy"; exit 1
