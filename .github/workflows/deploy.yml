# Auto-deploy to the VPS every time changes land on main (merged PRs or direct pushes).
# Required repository secrets: VPS_HOST, VPS_USER, VPS_SSH_KEY, VPS_PATH.
# Optional: VPS_PORT (default 22), VPS_KNOWN_HOSTS (output of `ssh-keyscan <host>`; scanned at run time if empty).
name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never run two deploys at once; a newer merge waits for the current deploy to finish.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          HOST: ${{ secrets.VPS_HOST }}
          PORT: ${{ secrets.VPS_PORT || '22' }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          if [ -n "$KNOWN_HOSTS" ]; then
            printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            ssh-keyscan -p "$PORT" "$HOST" > ~/.ssh/known_hosts
          fi

      - name: Pull and restart on the server
        env:
          HOST: ${{ secrets.VPS_HOST }}
          USER: ${{ secrets.VPS_USER }}
          PORT: ${{ secrets.VPS_PORT || '22' }}
          APP_PATH: ${{ secrets.VPS_PATH }}
          SHA: ${{ github.sha }}
        run: |
          ssh -i ~/.ssh/id_deploy -p "$PORT" "$USER@$HOST" \
            "set -e; cd '$APP_PATH'; git fetch origin main; git reset --hard '$SHA'; sh deploy/update.sh"
