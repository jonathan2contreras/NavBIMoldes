# Production stack for BIMTracker (moldes) on a VPS.
# HTTPS/ports 80+443 are handled by the shared proxy stack (~/proxy), not by this file.
# Usage (from the repo root):  docker compose -f deploy/docker-compose.prod.yml up -d --build
# Settings come from deploy/.env (copy deploy/.env.example; never commit it).
name: bimtracker

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_USER:?set MONGO_USER in deploy/.env}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_PASSWORD:?set MONGO_PASSWORD in deploy/.env}
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 20

  backend:
    build: ../backend
    restart: unless-stopped
    environment:
      - MONGO_URL=mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongo:27017/?authSource=admin
      - DB_NAME=${DB_NAME:-bimtracker}
      - EMERGENT_LLM_KEY=${EMERGENT_LLM_KEY:-}
      - JWT_SECRET=${JWT_SECRET:?set JWT_SECRET in deploy/.env}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:?set ADMIN_PASSWORD in deploy/.env}
      - UPLOAD_DIR=/data/uploads
    volumes:
      - uploads:/data/uploads
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/api/', timeout=5)"]
      interval: 30s
      timeout: 10s
      start_period: 180s
      retries: 5
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      default: {}
      web:
        aliases: [moldes-backend]

  frontend:
    build:
      context: ../frontend
      args:
        - REACT_APP_BACKEND_URL=https://${DOMAIN:?set DOMAIN in deploy/.env}
    restart: unless-stopped
    networks:
      default: {}
      web:
        aliases: [moldes-frontend]

networks:
  web:
    external: true
    name: web


volumes:
  mongo-data:
  uploads:
